# Builds the WebAssembly web UI (rust/web) and publishes it to the gh-pages branch, which GitHub
# Pages serves (Settings > Pages > Deploy from a branch > gh-pages, / (root)).
name: Web UI

on:
  push:
    branches: [main, rust-port]
    paths: ['rust/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # must match the wasm-bindgen version in rust/Cargo.lock
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.130

      - name: Build
        working-directory: rust
        run: |
          cargo build --release --target wasm32-unknown-unknown --features wasm --lib
          wasm-bindgen --target web --out-dir web/pkg target/wasm32-unknown-unknown/release/rbc.wasm
          rm -f web/pkg/.gitignore

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: rust/web
          force_orphan: true
          commit_message: 'Publish the web UI'
